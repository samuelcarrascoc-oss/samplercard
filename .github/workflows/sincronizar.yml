name: Sincronizar con TCGMatch y publicar

on:
  schedule:
    - cron: "7,37 * * * *"    # respaldo cada 30 min; GitHub descarta muchas corridas programadas (27-nov: 1 de 3 en 14 h)
  workflow_dispatch:          # botón "Run workflow"; el disparador del PC (Sitio/disparador) lo llama cada 20 min con forzar=no
    inputs:
      forzar:
        description: "si = publicar aunque no haya cambios; no = publicar solo si cambió el catálogo"
        default: "si"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    outputs:
      cambio: ${{ steps.guardar.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar catálogo de TCGMatch
        run: python scripts/sync.py
      - name: Guardar si cambió
        id: guardar
        run: |
          if git diff --quiet -- data; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Catálogo actualizado desde TCGMatch"
            # si alguien subió algo a main mientras corría el sync (27-nov falló así: "fetch first"), reintenta sobre lo nuevo
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              echo "push falló (intento $i), reintento"; sleep 5
            done
            git push --dry-run >/dev/null 2>&1 || { echo "no se pudo subir el catálogo"; exit 1; }
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: sincronizar
    if: needs.sincronizar.outputs.cambio == 'si' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.forzar != 'no')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Esperar a que el artefacto quede visible (deploy-pages a veces lo busca antes y no lo encuentra)
        run: sleep 30
      - id: deploy
        uses: actions/deploy-pages@v4
